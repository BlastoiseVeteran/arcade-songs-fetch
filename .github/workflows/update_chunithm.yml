name: Generate CHUNITHM data.json

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare DB config
        run: |
          # Use the example DB config (sqlite) unless a custom dbconfig.js is present
          if [ -f dbconfig.example.js ] && [ ! -f dbconfig.js ]; then
            cp dbconfig.example.js dbconfig.js
          fi

      - name: Run DB migrations
        run: |
          npm run db:migrate:all

      - name: Fetch CHUNITHM songs (populate DB)
        # This step fetches the basic song list that gen-json uses.
        # Optional extra fetches (intl sheets, extras) require secrets and are not run here.
        run: |
          npm run chunithm:fetch-songs

      - name: Generate CHUNITHM data.json
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          # If you need additional data (sheet extras / internal levels), set these secrets in the repo settings:
          # CHUNITHM_CHUNIREC_ACCESS_TOKEN: ${{ secrets.CHUNITHM_CHUNIREC_ACCESS_TOKEN }}
          # CHUNITHM_INTL_SEGA_ID: ${{ secrets.CHUNITHM_INTL_SEGA_ID }}
          # CHUNITHM_INTL_SEGA_PASSWORD: ${{ secrets.CHUNITHM_INTL_SEGA_PASSWORD }}
        run: |
          npm run chunithm:gen-json

      - name: Ensure generated file exists and create compatibility copy
        run: |
          if [ ! -f dist/chunithm/data.json ]; then
            echo "[!] ERROR: dist/chunithm/data.json not found"
            ls -la dist || true
            exit 1
          fi
          # create a compatibility copy under data/chunithm (some existing workflows expect that path)
          mkdir -p data/chunithm
          cp dist/chunithm/data.json data/chunithm/data.json

      - name: Upload artifact (data.json)
        uses: actions/upload-artifact@v4
        with:
          name: chunithm-data
          path: |
            dist/chunithm/data.json
            data/chunithm/data.json

      - name: Commit generated data.json back to repository
        if: github.event_name != 'pull_request'
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          git add dist/chunithm/data.json data/chunithm/data.json || true

          # Only commit when there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update generated CHUNITHM data.json [skip ci]"

          # Push back to the branch that triggered the workflow (GITHUB_TOKEN is used automatically)
          git push
