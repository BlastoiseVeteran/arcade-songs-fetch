name: Generate CHUNITHM data.json

# manual, scheduled, and push triggers
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC; adjust if needed
  push:
    branches:
      - main
      - master

# grant write permission so workflow can commit the generated file back
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # persist-credentials is true by default and allows pushing with GITHUB_TOKEN

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare DB config
        run: |
          # Copy example DB config so sequelize uses default sqlite storage
          if [ -f dbconfig.example.js ] && [ ! -f dbconfig.js ]; then
            cp dbconfig.example.js dbconfig.js
          fi

      - name: Run DB migrations
        run: |
          # Create the per-game sqlite DB files under data/<game>/db.sqlite3
          npm run db:migrate:all

      - name: Generate CHUNITHM data.json
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          # Map any required secrets here:
          # CHUNITHM_CHUNIREC_ACCESS_TOKEN: ${{ secrets.CHUNITHM_CHUNIREC_ACCESS_TOKEN }}
          # CHUNITHM_INTL_SEGA_ID: ${{ secrets.CHUNITHM_INTL_SEGA_ID }}
          # CHUNITHM_INTL_SEGA_PASSWORD: ${{ secrets.CHUNITHM_INTL_SEGA_PASSWORD }}
        run: |
          npm run chunithm:gen-json

      - name: Upload artifact (data.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunithm-data
          path: dist/chunithm/data.json

      - name: Commit generated data.json back to repository
        if: github.event_name != 'pull_request'
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

          if [ ! -f dist/chunithm/data.json ]; then
            echo "No generated file found, skipping commit"
            exit 0
          fi

          git add dist/chunithm/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update generated CHUNITHM data.json [skip ci]"

          # push back to the same branch that triggered the workflow (GITHUB_TOKEN used automatically)
          git push
