name: Auto-Generate CHUNITHM data.json

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Configuration Files
        run: |
          cp .env.example .env
          cp dbconfig.example.js dbconfig.js

      - name: Install Dependencies
        run: npm install

      - name: Migrate Database Schema
        run: npm run db:migrate:all

      - name: Fetch Song Data from SEGA JP
        run: npm run chunithm:fetch-songs

      - name: Generate JSON
        run: npm run chunithm:gen-json

      - name: Force Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "[*] Checking if data.json was actually generated..."
          if [ ! -f "data/chunithm/data.json" ]; then
            echo "[!] ERROR: data.json DOES NOT EXIST."
            echo "[!] The scraper failed to generate the file. Here is what is in the data folder:"
            ls -la data/
            ls -la data/chunithm/ || echo "chunithm folder missing too!"
            exit 1
          fi
          
          echo "[*] File found! Forcing Git to track it..."
          git add -f data/chunithm/data.json
          
          echo "[*] Committing changes..."
          git commit -m "Auto-update CHUNITHM data.json" || echo "No changes to commit."
          
          echo "[*] Pushing to repository..."
          # Using HEAD automatically pushes to whatever your default branch is (master or main)
          git push -f origin HEAD
